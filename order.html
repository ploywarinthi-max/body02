<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้าสั่งซื้อ */
    .page-title {
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .order-form {
      max-width: 34rem;
      margin-inline: auto;
    }

    .order-form .form-note {
      margin: 0.4rem 0 0;
    }

    .order-form .btn {
      margin-top: var(--space-4);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container-narrow">
      <div class="section-head">
        <h1 class="page-title">สั่งซื้อสินค้า</h1>
        <span class="rule"></span>
        <p class="lead">กรอกข้อมูลด้านล่างเพื่อยืนยันคำสั่งซื้อ</p>
      </div>

      <form id="orderForm" class="order-form">
        <div class="form-field">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" autocomplete="name" required>
        </div>

        <div class="form-field">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" required>
          <p class="form-note">กรอกเบอร์โทรหรือ Line ID ที่ติดต่อได้</p>
        </div>

        <div class="form-field">
          <label for="items">รายการสินค้า</label>
          <textarea id="items" name="items" rows="3" required></textarea>
          <p class="form-note">แก้ไขหรือเพิ่มรายการสินค้าได้ตามต้องการ</p>
        </div>

        <div class="form-field">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
        </div>

        <div class="form-field">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-solid btn-block">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <p>© 2026 Body Scent สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
