<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณสำหรับคำสั่งซื้อ | Body Scent</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้าขอบคุณ */
    .thanks {
      display: flex;
      align-items: center;
      min-height: calc(100vh - 4.5rem);
      min-height: calc(100svh - 4.5rem);
      padding-block: var(--space-6);
    }

    .thanks-inner {
      width: min(100% - 3rem, 36rem);
      margin-inline: auto;
    }

    .thanks h1 {
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .thanks .btn {
      margin-top: var(--space-3);
    }

    @media (max-width: 48rem) {
      .thanks {
        min-height: calc(100vh - 7rem);
        min-height: calc(100svh - 7rem);
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="thanks">
    <div class="thanks-inner text-center">
      <h1>ขอบคุณสำหรับคำสั่งซื้อ</h1>
      <span class="rule"></span>
      <p class="lead">เราได้รับข้อมูลของคุณแล้ว และจะติดต่อกลับทางเบอร์โทรหรือ Line ที่คุณระบุไว้</p>
      <a class="btn" href="index.html">กลับหน้าแรก</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <p>© 2026 Body Scent สงวนลิขสิทธิ์</p>
    </div>
  </footer>

</body>
</html>
